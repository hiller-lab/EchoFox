# Amino Acid Schema Configuration
# This file defines the 20 amino acids and their properties of interest
#
# Each amino acid has:
#   - one-letter: One-letter code as occurring in the protein sequences
#   - three-letters: Three-letter code
#   - name: Full name
#   - mw: Average molecular weight in Da
#   - category: acidic, basic, polar, non-polar or aromatic, used for colors coding in the histograms
#   - category-bachem: acidic, basic, polar or non-polar, used for colors coding in the histograms, based on bachem.com
#   - pka_n: pka if amino acid is at the N-terminus (for the current proteins only M of relevance)
#   - pka_c: pka if amino acid is at the C-terminus (for the current proteins only H of relevance)
# Some amino acids have:
#   - pka: pka of ionizable side chain (only for D, E, C, Y, H, K, R), rest 0
# (all pka-values taken from https://peptideweb.com/images/pdf/pKa-and-pI-values-of-amino-acids.pdf, vary with source)
#   - ec: extinction coefficient in (M⁻¹cm⁻¹) for amino acids absorbing at 280 nm (C, W, Y), rest 0


